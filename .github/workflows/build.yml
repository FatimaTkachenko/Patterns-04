name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Start SUT and wait for it
        run: |
          # запускаем приложение и сохраняем логи в файл
          java -jar artifacts/app-replan-delivery.jar > app.log 2>&1 &
          APP_PID=$!
          
          # ждём до 30 секунд, пока приложение не запустится
          for i in {1..30}; do
            if curl -s http://localhost:9999 > /dev/null 2>&1; then
              echo "✅ Приложение запустилось!"
              break
            fi
            echo "⏳ Ждём... $i сек"
            sleep 1
          done
          
          # выводим логи приложения
          echo "===== ЛОГИ ПРИЛОЖЕНИЯ ====="
          cat app.log

      - name: Run tests
        run: ./gradlew test -Dselenide.headless=true --info
