name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Start SUT
        run: |
          java -jar artifacts/app-replan-delivery.jar &
          sleep 20
          # проверяем, что приложение запустилось
          curl -s http://localhost:9999 | head -5

      - name: Run tests
        run: ./gradlew test -Dselenide.headless=true --info