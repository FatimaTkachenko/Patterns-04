name: Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Check artifacts exist
        run: |
          ls -la artifacts/
          file artifacts/app-replan-delivery.jar
          file artifacts/app-ibank.jar

      - name: Start SUT for Task 1 (Delivery)
        run: |
          nohup java -jar artifacts/app-replan-delivery.jar &
          sleep 20

      - name: Start SUT for Task 2 (API)
        run: |
          nohup java -jar artifacts/app-ibank.jar -P:profile=test &
          sleep 20

      - name: Check if SUT is running
        run: |
          curl -v http://localhost:9999 || true
          netstat -tlnp || true

      - name: Run tests in headless mode
        run: |
          ./gradlew clean test -Dselenide.headless=true -Dselenide.browser=chrome

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/test