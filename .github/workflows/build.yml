name: Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create artifacts folder
        run: mkdir -p artifacts

      - name: Download SUT JAR files
        run: |
          curl -L -o artifacts/app-replan-delivery.jar https://github.com/netology-code/aqa-homeworks/raw/api-ci/patterns/app-replan-delivery.jar
          curl -L -o artifacts/app-ibank.jar https://github.com/netology-code/aqa-homeworks/raw/api-ci/patterns/app-ibank.jar
          ls -la artifacts/

      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser
          chromium-browser --version

      - name: Start SUT for Task 1 (Delivery)
        run: |
          nohup java -jar artifacts/app-replan-delivery.jar &
          sleep 30

      - name: Start SUT for Task 2 (API)
        run: |
          nohup java -jar artifacts/app-ibank.jar -P:profile=test &
          sleep 30

      - name: Check if SUT is running
        run: |
          curl -v http://localhost:9999 || true
          ps aux | grep java

      - name: Run tests
        run: ./gradlew clean test -Dselenide.headless=true -Dselenide.browser=chrome

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/test